[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sce-af"
dynamic = ["version"]
description = "SCE-af local application"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.dynamic]
version = {attr = "sce_af.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
