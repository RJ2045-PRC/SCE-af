<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCE-af</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">SCE-af <span id="app_version"></span></div>
    <p id="key_state" class="muted"></p>
  </header>
  <main>
    <p id="status" class="status" role="status">导入气泡图 PDF，切块识图后核对 JSON。</p>
    <section class="card">
      <label class="filepick">
        选择 PDF
        <input id="pdf_file" type="file" accept="application/pdf,.pdf" />
      </label>
      <button id="start_btn" type="button">开始识图</button>
      <p id="progress" class="muted"></p>
    </section>

    <section id="result" class="hidden">
      <section class="card">
        <h2>图纸基本信息</h2>
        <div class="grid">
          <label>文件名 <input id="f_filename" readonly /></label>
          <label>客户 <input id="f_customer" /></label>
          <label>品名 <input id="f_part_name" /></label>
          <label>模号 <input id="f_mold_no" /></label>
          <label>料号 <input id="f_part_no" /></label>
          <label>图号 <input id="f_drawing_no" /></label>
          <label>版本 <input id="f_revision" /></label>
        </div>
        <button id="save_header" type="button">保存编号</button>
      </section>

      <section class="card">
        <h2>问题</h2>
        <ul id="issues"></ul>
      </section>

      <section class="card">
        <h2>气泡</h2>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>号</th><th>页</th><th>特殊特性</th><th>特性号</th>
                <th>类型</th><th>描述</th><th>名义</th><th>上限</th><th>下限</th>
              </tr>
            </thead>
            <tbody id="bubbles"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>技术要求</h2>
        <h3>条文</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr><th>号</th><th>页</th><th>特殊特性</th><th>特性号</th><th>正文</th></tr>
            </thead>
            <tbody id="notes"></tbody>
          </table>
        </div>
        <h3>特性表</h3>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th>CC</th><th>SC</th><th>名称</th><th>参数</th>
                <th>视图</th><th>区域</th><th>位置</th><th>页</th>
              </tr>
            </thead>
            <tbody id="chars"></tbody>
          </table>
        </div>
      </section>

      <p><a id="download" href="#">下载 JSON</a></p>
    </section>
  </main>
  <footer class="site-foot"><span id="app_version_foot"></span></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
